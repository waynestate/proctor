name: CI

on:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Refresh dependencies
        run: composer update
      - name: Run the checks
        run: composer ci
