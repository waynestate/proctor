# composer ci is the contract: the checks are defined there, and this pipeline only wraps them.
# PROCTOR's pipeline, built from the PREFLIGHT components on this GitLab.
# Pinned to PREFLIGHT 0.1.4. Never use ~latest.
# PROCTOR requires PHP ^8.3, so the test matrix starts at 8.3.
# Docker Hub images go through the GitLab Dependency Proxy to avoid the anonymous pull limit.
# This is the repo's own trusted pipeline: PROCTOR refuses --policy and --today in CI unless
# PROCTOR_ALLOW_OVERRIDES is exactly 1, and the proctor job below passes --policy=. An app must
# not do this in its own .gitlab-ci.yml; there the variable belongs to a protected or group-level
# CI variable of a trusted job.
variables:
  PROCTOR_ALLOW_OVERRIDES: "1"
  COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.cache/composer"

include:
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/php-test@0.1.4
    inputs:
      php_versions: ["8.3", "8.4", "8.5"]
      image: "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/php:${PHP_VERSION}-cli-trixie"
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/composer-audit@0.1.4
    inputs:
      image: "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2@sha256:b6dcd72ca98fa19d0e5b8476de179859704891fad06dd9e0b96833d4c430a5fc"
  # The front page deploy layer (ADR-0017): PROCTOR checks deploy/ against CREED's policy.
  # allow_failure: current findings: unbounded dev-main constraints; CI files missing in deploy/.
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/proctor@0.1.4
    inputs:
      working_dir: deploy
      proctor_command: vendor/bin/proctor check --policy=vendor/waynestate/creed/policy/policy.json --format=codequality
      allow_failure: true
      image: "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/php:8.4-cli-trixie@sha256:9cf851bc2c1b37c3e59dfd677a3c3e56d485af5a47c93f629424bb039eafcb69"

# Dependency caching: images already come through the Dependency Proxy, and
# every job that installs packages extends a cache keyed on its lock files,
# so a pipeline downloads only what changed instead of everything, every run.
.composer-cache:
  cache:
    key:
      files: [composer.lock, deploy/composer.lock]
      prefix: composer
    paths: [.cache/composer/]

# WayneUI strict copies: the script scans a copy of the root without tests/fixtures.
# The setting extra.proctor."wayneui.copies" = "fail" in composer.json makes a stale copy fail.
wayneui-copies:
  extends: .composer-cache
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2.10.3
  script:
    - composer install --working-dir=deploy --no-interaction --no-progress --prefer-dist
    - sh scripts/wayneui-copies-scan.sh

composer-ci:
  extends: .composer-cache
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2.10.3
  script:
    - composer install --no-interaction --no-progress --prefer-dist
    - composer ci

# release-phar: builds the single-file PHAR and ships it with the GitLab Release.
# Runs on tags only (rules: if: $CI_COMMIT_TAG): the lead cuts the tag, and this
# job does the rest. No tag, no run. Everything happens inside the already-PHP
# composer image, so there is no Docker-in-Docker and no release tooling on the
# arm64 runner: curl and the GitLab API do the publishing.
release-phar:
  extends: .composer-cache
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2.10.3
  rules:
    - if: $CI_COMMIT_TAG
  script:
    # The composer image may lack curl; the package registry and release calls below need it.
    - apk add --no-cache curl
    - composer install --no-interaction --no-progress
    - |
      set -eu
      ROOT="$(pwd)"
      TMP="$(mktemp -d)"
      # The same steps scripts/build-phar.sh runs through Docker, done here inside
      # the container: copy the runtime sources to a temp dir, install the no-dev
      # deps there, and run vendor/bin/box compile against that copy (box.json.dist
      # included), so the phar holds src/ and the runtime vendor deps only.
      cp -R "$ROOT/src" "$TMP/src"
      cp -R "$ROOT/bin" "$TMP/bin"
      cp "$ROOT/composer.json" "$TMP/composer.json"
      cp "$ROOT/composer.lock" "$TMP/composer.lock"
      cp "$ROOT/box.json.dist" "$TMP/box.json.dist"
      (cd "$TMP" && composer install --no-dev --no-interaction --no-progress --optimize-autoloader)
      (cd "$TMP" && php -d phar.readonly=0 "$ROOT/vendor/bin/box" compile)
      mkdir -p "$ROOT/build"
      cp "$TMP/build/proctor.phar" "$ROOT/build/proctor.phar"
      rm -rf "$TMP"
      # Verify the phar runs and prints a version.
      VERSION_OUTPUT="$(php build/proctor.phar --version)"
      if [ -z "$VERSION_OUTPUT" ]; then
        echo "build/proctor.phar printed no version" >&2
        exit 1
      fi
      echo "$VERSION_OUTPUT"
      # Checksum file for the download page.
      sha256sum build/proctor.phar > build/proctor.phar.sha256
      # Refuse to overwrite: if the package file for this tag already exists
      # (HTTP 200 on a HEAD request), fail the job.
      PACKAGE_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/proctor/${CI_COMMIT_TAG}"
      HTTP_CODE="$(curl -s -o /dev/null -I --header "JOB-TOKEN: $CI_JOB_TOKEN" -w '%{http_code}' "$PACKAGE_URL/proctor.phar")"
      if [ "$HTTP_CODE" = "200" ]; then
        echo "package proctor/${CI_COMMIT_TAG}/proctor.phar already exists; refusing to overwrite" >&2
        exit 1
      fi
      HTTP_CODE="$(curl -s -o /dev/null -I --header "JOB-TOKEN: $CI_JOB_TOKEN" -w '%{http_code}' "$PACKAGE_URL/proctor.phar.sha256")"
      if [ "$HTTP_CODE" = "200" ]; then
        echo "package proctor/${CI_COMMIT_TAG}/proctor.phar.sha256 already exists; refusing to overwrite" >&2
        exit 1
      fi
      # Upload both files to the project's generic package registry.
      curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file build/proctor.phar "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/proctor/${CI_COMMIT_TAG}/proctor.phar"
      curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file build/proctor.phar.sha256 "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/proctor/${CI_COMMIT_TAG}/proctor.phar.sha256"
      # Attach both files as release asset links to the GitLab Release for the tag.
      # Create it with POST ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases
      # (JOB-TOKEN, JSON name, tag_name, assets.links); if the release already
      # exists, POST ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${CI_COMMIT_TAG}/assets/links
      # once per file instead.
      PHAR_URL="$PACKAGE_URL/proctor.phar"
      SHA_URL="$PACKAGE_URL/proctor.phar.sha256"
      cat > /tmp/release.json <<EOF
      {
          "name": "PROCTOR ${CI_COMMIT_TAG}",
          "tag_name": "${CI_COMMIT_TAG}",
          "assets": {
              "links": [
                  { "name": "proctor.phar", "url": "${PHAR_URL}" },
                  { "name": "proctor.phar.sha256", "url": "${SHA_URL}" }
              ]
          }
      }
      EOF
      HTTP_CODE="$(curl -s -o /tmp/release-response.json -w '%{http_code}' --request POST --header "JOB-TOKEN: $CI_JOB_TOKEN" --header "Content-Type: application/json" --data @/tmp/release.json "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases")"
      if [ "$HTTP_CODE" = "201" ]; then
        echo "Created release ${CI_COMMIT_TAG} with both asset links."
      else
        echo "Release creation answered ${HTTP_CODE}; assuming the release exists and adding the links per file."
        cat /tmp/release-response.json
        curl --fail --request POST --header "JOB-TOKEN: $CI_JOB_TOKEN" --header "Content-Type: application/json" --data "{\"name\": \"proctor.phar\", \"url\": \"${PHAR_URL}\"}" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${CI_COMMIT_TAG}/assets/links"
        curl --fail --request POST --header "JOB-TOKEN: $CI_JOB_TOKEN" --header "Content-Type: application/json" --data "{\"name\": \"proctor.phar.sha256\", \"url\": \"${SHA_URL}\"}" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${CI_COMMIT_TAG}/assets/links"
      fi
