name: CI

on:
  push:
    branches: ['**']
    tags: ['v*', '*.*.*']

permissions:
  contents: read

jobs:
  ci:
    # pin to a PREFLIGHT tag at its first GitHub release
    uses: waynestate/preflight/.github/workflows/php-package.yml@main
    with:
      php-versions: '["8.3","8.4","8.5"]'
      ci-command: composer ci
